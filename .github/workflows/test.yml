name: Resume evidence checks
on:
  push:
    branches: [resume-evidence-v2-preview]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m py_compile app.py resume_explorer/engine.py api/main.py
